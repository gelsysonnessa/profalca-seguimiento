<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Seguimiento PROFALCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  
  <style>
  :root{
    --bg:#E9EEF0; --surface:#FFFFFF; --surface2:#F2F5F6; --ink:#12202A; --muted:#566874; --line:#D3DCE1;
    --accent:#0284C7; --accent-ink:#FFFFFF; --accent-soft:#E0F2FE;
    --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7; --crit:#DC2626; --crit-soft:#FEE2E2;
    --idle:#64748B; --idle-soft:#F1F5F9;
    --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#B9C0C5; --paper-head:#E6EBEE;
    --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
    --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E181E; --surface:#15242C; --surface2:#1B2E38; --ink:#E3ECF0; --muted:#93A7B2; --line:#2A3F4B;
      --accent:#4DB6DE; --accent-ink:#06222D; --accent-soft:#14394A;
      --ok:#5CC38A; --ok-soft:#173B2A; --warn:#E2A93B; --warn-soft:#3F3012; --crit:#F0857C; --crit-soft:#4A1F1B;
      --idle:#98A9B3; --idle-soft:#243540; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E181E; --surface:#15242C; --surface2:#1B2E38; --ink:#E3ECF0; --muted:#93A7B2; --line:#2A3F4B;
    --accent:#4DB6DE; --accent-ink:#06222D; --accent-soft:#14394A;
    --ok:#5CC38A; --ok-soft:#173B2A; --warn:#E2A93B; --warn-soft:#3F3012; --crit:#F0857C; --crit-soft:#4A1F1B;
    --idle:#98A9B3; --idle-soft:#243540; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;min-height:100vh}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
  button,input,select,textarea{font:inherit;color:inherit}
  .mono{font-family:var(--f-mono);font-size:.86em}
  .muted{color:var(--muted)}
  .wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg, #07384E 0%, #0B5678 50%, #0D6890 100%);border-bottom:2px solid #062B3D;color:#FFFFFF;box-shadow:0 2px 10px rgba(7,56,78,.2)}
  .top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font:700 23px var(--f-display);letter-spacing:.09em;color:#FFFFFF;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .brand span{font-size:12px;color:#A8D1E2;letter-spacing:.04em}
  nav{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1}
  nav button{background:none;border:0;border-radius:3px 3px 0 0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font:600 14.5px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#D2E7F1;white-space:nowrap;transition:all .18s ease}
  nav button:hover{color:#FFFFFF;background:rgba(255,255,255,0.08)}
  nav button.on{color:#FFFFFF;border-bottom-color:#38BDF8;background:rgba(255,255,255,0.12)}
  .user-box{display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.24);padding:5px 12px;border-radius:20px;color:#FFFFFF;backdrop-filter:blur(6px)}
  .user-box span{color:#E0F0F8}
  .user-name{color:#FFFFFF;cursor:pointer;text-decoration:underline dotted}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  .status-dot.syncing{background:var(--warn);animation:pulse 1s infinite alternate}
  .status-dot.offline{background:var(--crit)}
  @keyframes pulse{from{opacity:.4}to{opacity:1}}
  .user-name{font-weight:600;cursor:pointer;text-decoration:underline dotted}
  main{padding-block:22px 80px}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pagehead h2{font-size:28px}
  .btn{background:var(--surface);border:1px solid var(--line);padding:7px 14px;cursor:pointer;font-weight:500;border-radius:3px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.pri:hover{filter:brightness(1.1);color:var(--accent-ink)}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btn.sm{padding:3px 9px;font-size:13px}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .panel{background:var(--surface);border:1px solid var(--line);padding:16px;min-width:0}
  .panel h3{font-size:17px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
  .c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
  @media(max-width:900px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
  .pill{display:inline-block;padding:2px 10px;font-size:12.5px;font-weight:700;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
  .s-idle{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}
  .s-info{background:#E0F2FE;color:#0284C7;border:1px solid #BAE6FD}
  .s-ok{background:#DCFCE7;color:#15803D;border:1px solid #BBF7D0}
  .s-crit{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA}
  .s-warn{background:#FEF3C7;color:#B45309;border:1px solid #FDE68A}
  .flag{font-size:12px;font-weight:600;color:var(--crit)}
  .flag.k{color:var(--warn)}
  .hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
  @media(max-width:700px){.hero{grid-template-columns:1fr}}
  .big{font:700 46px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
  .big small{font-size:24px}
  .seg{display:flex;height:18px;background:var(--surface2);overflow:hidden;border:1px solid var(--line);border-radius:2px}
  .seg i{display:block;height:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--c);border-radius:2px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .stat b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bars{display:grid;gap:7px}
  .bar{display:grid;grid-template-columns:minmax(80px,150px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
  .bar .t{height:12px;background:var(--surface2);border:1px solid var(--line)}
  .bar .t i{display:block;height:100%;background:var(--accent)}
  .bar b{text-align:right;font-variant-numeric:tabular-nums}
  .list{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;min-width:0}
  .list li:first-child{border-top:0}
  .list .tx{min-width:0;flex:1}
  .fin{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
  .fin dt{color:var(--muted)}.fin dd{margin:0;text-align:right;font-weight:600}
  .tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%}
  th{font:600 12.5px var(--f-display);text-transform:uppercase;letter-spacing:.08em;text-align:left;color:var(--muted);padding:9px 10px;background:var(--surface2);white-space:nowrap;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:first-child td{border-top:0}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .prog{display:flex;align-items:center;gap:6px;min-width:90px}
  .prog .t{flex:1;height:7px;background:var(--surface2);border:1px solid var(--line)}
  .prog .t i{display:block;height:100%;background:var(--accent)}
  .prog span{font-size:12.5px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input,select,textarea{background:var(--surface);border:1px solid var(--line);padding:7px 10px;border-radius:3px;min-width:0;max-width:100%}
  textarea{width:100%;resize:vertical;min-height:90px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  .mlist{display:grid;gap:0;background:var(--surface);border:1px solid var(--line)}
  .mlist button{display:block;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;cursor:pointer;border-left:4px solid transparent}
  .mlist button:first-child{border-top:0}
  .mlist button.on{background:var(--accent-soft);border-left-color:var(--accent)}
  .mlist b{font:600 16px var(--f-display);display:block}
  .mlist span{font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:14px 0;overflow-x:auto}
  .tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--surface2);border:1px solid var(--line);padding:1px 9px;font-size:13px}
  .sec{border-top:1px solid var(--line);padding:12px 0}
  .sec:first-child{border-top:0}
  .sec h4{margin:0 0 4px;font:600 17px var(--f-display);display:flex;gap:10px;justify-content:space-between;align-items:baseline}
  .sec .body p{margin:.3em 0;text-align:justify;text-justify:inter-word}.sec .body ul{margin:.3em 0;padding-left:1.2em}
  .sec .body li{text-align:justify;text-justify:inter-word}
  .body{max-width:80ch}
  .paperwrap{overflow-x:auto}
  .paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);padding:36px 40px;max-width:860px;margin:0 auto;font:14px/1.5 Arial,Helvetica,sans-serif}
  .paper h1{font:700 20px Arial,sans-serif;margin:0 0 10px}
  .paper h2{font:700 15px Arial,sans-serif;margin:22px 0 6px;text-transform:uppercase}
  .paper h3{font:700 14px Arial,sans-serif;margin:14px 0 4px}
  .paper p{margin:4px 0;text-align:justify;text-justify:inter-word}.paper ul{margin:4px 0;padding-left:22px}
  .paper li{text-align:justify;text-justify:inter-word}
  .paper table{border:1px solid var(--paper-line);margin:8px 0;font-size:12.5px}
  .paper th{background:var(--paper-head);color:var(--paper-ink);border:1px solid var(--paper-line);font:700 12px Arial,sans-serif;letter-spacing:0;text-transform:none;white-space:normal}
  .paper td{border:1px solid var(--paper-line);vertical-align:top}
  .paper .hd{background:var(--paper-head);border:1px solid var(--paper-line);padding:8px 10px;font-weight:700;text-align:center;margin-top:26px}
  .paper .nota{border:1px solid var(--paper-line);padding:8px 12px;margin:10px 0;text-align:justify;text-justify:inter-word}
  #modal{position:fixed;inset:0;z-index:50;background:rgba(8,16,22,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
  #modal.on{display:flex}
  .dlg{background:var(--surface);border:1px solid var(--line);width:min(720px,100%);padding:20px;margin-block:auto}
  .dlg h3{font-size:22px;margin-bottom:14px}
  .form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .f{display:grid;gap:3px;grid-column:span 6;min-width:0}
  .f.h{grid-column:span 3}.f.t{grid-column:span 2}
  @media(max-width:600px){.f.h,.f.t{grid-column:span 6}}
  .f label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .f .ck{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14.5px;color:var(--ink);letter-spacing:0}
  .f input[type=checkbox]{width:auto}
  .dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .dlg .acts .sp{margin-right:auto}
  .err{color:var(--crit);font-size:13.5px;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;z-index:60;display:none;max-width:90vw;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  #toast.on{display:block}
  .hist td{font-size:13.5px}
  .note{font-size:13px;color:var(--muted)}
  @media(prefers-reduced-motion:no-preference){.seg i{transition:width .3s}}
  </style>
</head>

<header class="top">

  </div>
</header>

      {
        "t": "Disponibilidad de fondos y coordinación con Pequiven.",
        "b": "Se precisó que no debe asumirse un capital neto mayor a US$900.000, debido a que existe una deuda que debe compensarse. Por tanto, el presupuesto debe basarse en los recursos realmente disponibles. Se cuestionó la expectativa de arrancar con una inversión de entre US$600.000 y US$800.000, por no reflejar las necesidades reales.\nSe recalcó que es necesario conocer el déficit antes de conversar con Pequiven.\nSe propuso tratar por separado el estado general de los trabajos de PDVSA. La próxima reunión deberá centrarse en los números, los trabajos requeridos y los aportes necesarios. El objetivo es salir con un entregable que exponga la situación real. Como referencia, se planteó poder decir: \"esta es la realidad, estamos a un millón de dólares y tres meses de trabajo de lograr\", aunque la cifra final aún debe determinarse."

      {
        "t": "Revisión del Plan de Trabajos Críticos (Avance real: 15,43%)",
        "b": "Se presentó el estado actual del plan de trabajos críticos de PROFALCA, con un avance real del 15,43% frente a un 100% planificado, evidenciando una desviación del 84,57%. Los hallazgos principales son:\n- Completados (100%): Procura de materiales para líneas de vapor y condensado; revisión del compresor K-2301.\n- En ejecución parcial (20-50%): Mantenimiento correctivo de transformadores TR-1 y TR-2 (25%); trabajos de soldadura de vapor y condensado (20%); procura de tambores de aceite ISO 46 para el K-2301 y aceite Venoturbing ISO 32 (50%); materiales en exterior LASO (50%).\n- Pendientes o en espera de propuestas: Certificación de medidores de transferencia y custodia; soldaduras en vértice de tubería 8\" tope C-1101; adecuación de servidores del sistema de control; procura de metanol para bombas; repuestos y reparación del generador de emergencia; kits de repuestos para sellos de bombas.\n- En espera de recursos GZ: Procura de tambores de aceite ISO 46 y Venoturbing ISO 32.\n- En espera de pago GZ: Materiales LASO en el exterior.\n- Haciendo contactos con especialistas: Revisión del compresor K-1401 (requiere grúa); asistencia técnica de Honeywell, CCC y especialistas de compresores.\nEn el rubro Materiales en el Exterior, el avance real es del 25% con una desviación del 75%. El proveedor PRIMAR reporta costos elevados y se mantiene en comunicación."
      },
      {
        "t": "Herramienta de seguimiento y control del proyecto",
        "b": "Se incorporó una herramienta de seguimiento para monitorear las 17 actividades clave del proyecto de pre-arranque, con el objetivo de visualizar estado, presupuesto, tiempo restante, faltantes y posibles actividades adicionales. La herramienta funcionará como un \"ancla\" de control general para mantener una proyección integral del proyecto."
      },
      {
        "t": "Ruta crítica: Compresor K-1401 y boroscopia",
        "b": "Se identificó que la actividad decisiva para el arranque es determinar si debe abrirse el compresor K-1401. Se acordó priorizar una boroscopia antes de comprometer trabajos, pagos y plazos de apertura. El resultado de esta inspección definirá la ruta crítica del proyecto.\nHistóricamente, el K-1401 presentó inestabilidad por controles obsoletos, calidad del gas y vapores calientes. La migración del PLC, ajustes de control y un revamping corrigieron esa condición antes de su parada en 2018. Se prevé realizar análisis de aceite antes de llenarlo con aceite nuevo adquirido en 2022-2023."
      },
      {
        "t": "Flushing de líneas y mantenimiento de fan coolers",
        "b": "Se acordó que, aunque no estaba incluido inicialmente, es necesario ejecutar un flushing integral de las líneas tras el largo período de inactividad, para remover desprendimientos internos y reducir contaminación aguas abajo. Esta actividad debe ser obligatoria como parte del pre-arranque.\nRespecto a los fan coolers, se detectó suciedad importante en las aletas (excrementos de aves y deterioro). El E2301B1 está fuera de servicio por daño en el eje, pero el efecto sobre la condensación es limitado dado que normalmente operan alrededor de seis de los doce disponibles. Se recomienda limpieza con soplado y agua, evitando los químicos que deterioraron las aletas anteriormente."
      },
      {
        "t": "Propuesta de soldadura para vapor y condensado",
        "b": "La oferta recibida asciende a US$15.036, más 10% de gastos administrativos e impuestos, para un total de US$19.185, pagadero en bolívares. Se solicita un anticipo del 25% para formalizar el contrato. Se requiere que el contratista cotice los consumibles necesarios para evitar que la obra se detenga por falta de materiales."
      },
      {
        "t": "Cooperación técnica con Propilven",
        "b": "Se destacó la oportunidad de aprovechar la experiencia de Propilven, cuya metodología de pruebas \"equipo por equipo\" ofrece una referencia para fortalecer la confiabilidad y seguridad de PROFALCA. Se propone un intercambio bilateral de personal: trabajadores de Propilven visitarán PROFALCA y, a su vez, personal de PROFALCA conocerá el trabajo realizado en Propilven. Se plantea enviar un equipo de tres o cuatro personas a Maracaibo."
      },
      {
        "t": "Restricciones financieras y de proveedores",
        "b": "Los atrasos de proveedores afectan tanto el cronograma como el presupuesto. Se requiere definir un monto de inversión firme. Los pagos en bolívares no presentan mayores obstáculos, pero los pagos en dólares requieren confirmar que no generarán penalidades ni problemas de licencia o cumplimiento internacional. Se plantea anticipar riesgos con proveedores especializados (Honeywell, Triple C y otras procuras) para evitar que el proyecto se detenga por contingencias previsibles.\nPequiven depositó los recursos mensuales, incluido un primer pago de noviembre, lo que permitiría cancelar utilidades al personal. El requerimiento de fondos fue cercano a US$95.000, incluyendo aproximadamente US$35.000 por utilidades."
      },

async function syncMeetingsText(silent = false) {
  if (!db) return;
  try {
    for (const m of FULL_MEETINGS) {
      await db.doc('meetings/' + m._id).set(clean(m), { merge: true });
    }
    if (!silent) toast('Minutas 1 y 2 actualizadas con su texto completo');
  } catch(e) {
    console.error('Error al sincronizar texto de minutas:', e);
  }
}

async function populateInitialData(force = false) {
  if (!db) { toast('Base de datos no inicializada'); return; }
  toast('Cargando datos originales de PROFALCA a Firebase...');
  try {
    const batch = db.batch();
    for (const a of SEED_DATA.acts) {
      batch.set(db.doc('acts/' + a._id), clean(a));
    }
    for (const m of SEED_DATA.meetings) {
      batch.set(db.doc('meetings/' + m._id), clean(m));
    }
    for (const e of SEED_DATA.entries) {
      batch.set(db.doc('entries/' + e._id), clean(e));
    }
    for (const ag of SEED_DATA.agreements) {
      batch.set(db.doc('agreements/' + ag._id), clean(ag));
    }
    batch.set(db.doc('config/main'), { fondos: null }, { merge: true });
    await batch.commit();
    await logc('Cargó los datos originales de PROFALCA');
    toast('¡40 actividades, bitácoras y acuerdos cargados con éxito!');
  } catch(err) {
    console.error(err);
    fail(err);
  }
}

const prog = a => {
  if (!a) return 0;
  if (a.estatus === 'Completado') return 100;
  let val = a.avance;
  if (val == null || val === '') {
    const meetsMap = new Map((S.meetings||[]).map(m => [m._id, m]));
    const entries = S.entries.filter(x => x.actId === a._id);
    if (entries.length) {
      entries.sort((x, y) => {
        const mx = meetsMap.get(x.meetingId), my = meetsMap.get(y.meetingId);
        const dx = mx ? mx.fecha : '0000-00-00', dy = my ? my.fecha : '0000-00-00';
        return dy.localeCompare(dx) || (y.ord || 0) - (x.ord || 0);
      });
      const latest = entries.find(x => x.avance != null && x.avance !== '') || entries[0];
      if (latest && latest.avance != null && latest.avance !== '') val = latest.avance;
    }
  }
  if (val != null && val !== '') {
    const num = parseFloat(String(val).replace(/[^0-9.-]/g, ''));
    if (!isNaN(num)) return Math.min(100, Math.max(0, num));
  }
  return 0;
};
const isDone = a => a.estatus === 'Completado';
const isOver = a => a.fechaObj && !isDone(a) && a.fechaObj < today();
const isBlocked = a => !isDone(a) && (a.estatus === 'Bloqueado' || !!a.bloqueo);
const sortedEntries = mid => S.entries.filter(e => e.meetingId === mid).sort((a,b) => {
  const diff = statusRank(a.estatus) - statusRank(b.estatus);
  if(diff !== 0) return diff;
  return (a.ord??0)-(b.ord??0) || actNum(a.actId)-actNum(b.actId);
});

/* ---------- Descargas Universales en Navegador ---------- */
function saveFile(filename, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 150);
  } catch(e) {
    console.error("Error al guardar archivo:", e);
    toast("No se pudo iniciar la descarga.");
  }
}

let raf = 0;
function sched(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

let isSyncingActs = false;
async function syncActsWithLatestRSE() {
  if (isSyncingActs || !db || !S.acts || !S.acts.length || !S.entries || !S.entries.length) return;
  isSyncingActs = true;
  try {
    const meetsMap = new Map((S.meetings||[]).map(m => [m._id, m]));
    for (const a of S.acts) {
      const entries = S.entries.filter(e => e.actId === a._id);
      if (!entries.length) continue;
      entries.sort((x, y) => {
        const mx = meetsMap.get(x.meetingId), my = meetsMap.get(y.meetingId);
        const dx = mx ? mx.fecha : '0000-00-00', dy = my ? my.fecha : '0000-00-00';
        return dy.localeCompare(dx) || (y.ord || 0) - (x.ord || 0);
      });
      const latest = entries[0];
      const needsEstatusUpdate = latest && latest.estatus && a.estatus !== latest.estatus;
      const needsAvanceUpdate = latest && latest.avance != null && latest.avance !== '' && a.avance !== latest.avance;
      if (needsEstatusUpdate || needsAvanceUpdate) {
        const up = {};
        if (needsEstatusUpdate) {
          console.log(`Harmonizando estatus ${a._id}: ${a.estatus} -> ${latest.estatus}`);
          a.estatus = latest.estatus;
          up.estatus = latest.estatus;
          if (latest.estatus === 'Completado' && (a.avance === null || a.avance < 100)) {
            up.avance = 100;
            a.avance = 100;
          }
        }
        if (needsAvanceUpdate && up.avance === undefined) {
          a.avance = latest.avance;
          up.avance = latest.avance;
        }
        await db.doc('acts/' + a._id).set(up, { merge: true });
      }
    }
  } catch(err) {
    console.warn('Error en syncActsWithLatestRSE:', err);
  } finally {
    isSyncingActs = false;
  }
}

function sub1(name, q){
  q.onSnapshot(s => {
    S[name] = s.docs.map(d => ({ _id: d.id, ...d.data() }));
    loaded[name] = 1;
    if (loaded.acts && loaded.entries) {
      syncActsWithLatestRSE();
    }
    sched();
    $('#statusDot').className = 'status-dot';
  }, e => {
    console.error(name, e);
    loaded[name] = 1;
    sched();
    $('#statusDot').className = 'status-dot offline';
    if(e && e.code === 'permission-denied'){
      toast('Atención: Activa el modo de prueba en las reglas de Firestore');
    }
  });
}

async function boot(){
  $('#who').textContent = myName;
  $('#who').onclick = changeUserName;

  if(!db){
    $('#app').innerHTML = `<div class="empty">
      <h3>Error de conexión con Firebase</h3>
      <p>Revisa la configuración o la consola del navegador.</p>
    </div>`;
    return;
  }

  // Suscribirse a las colecciones de Firestore
  ['acts','meetings','entries','agreements'].forEach(n => sub1(n, db.collection(n)));

  // Auto-verificar si las minutas necesitan su texto completo o si falta ACT-40
  setTimeout(() => {
    if (db && S.meetings && S.meetings.length > 0) {
      const m1 = S.meetings.find(m => m._id === 'm-2026-10-07');
      const m2 = S.meetings.find(m => m._id === 'm-2026-10-21');
      if ((!m1 || !m1.secs || !m1.secs.length) || (!m2 || !m2.secs || !m2.secs.length)) {
        console.log('Sincronizando texto de las minutas en Firestore...');
        syncMeetingsText(true);
      }
    }
    if (db && S.acts && S.acts.length > 0 && !S.acts.some(a => a._id === 'ACT-40')) {
      const act40 = SEED_DATA.acts.find(a => a._id === 'ACT-40');
      if (act40) {
        console.log('Sincronizando ACT-40 en Firestore...');
        db.doc('acts/ACT-40').set(clean(act40));
      }
    }
  }, 1200);
  sub1('log', db.collection('log').orderBy('ts','desc').limit(150));
  
  db.doc('config/main').onSnapshot(s => {
    S.config = s.exists ? s.data() : {};
    loaded.config = 1;
    sched();
  }, () => {});
}

function bodyHTML(t){
  const lines = String(t||'').split('\n'); let out = '', ul = false;
  for(const l of lines){
    const b = /^\s*[-•●]\s+(.*)$/.exec(l);
    if(b){ if(!ul){ out += '<ul>'; ul = true; } out += `<li>${esc(b[1])}</li>`; }
    else{ if(ul){ out += '</ul>'; ul = false; } if(l.trim()) out += `<p>${esc(l)}</p>`; }
  }
  if(ul) out += '</ul>'; return out;
}

/* ---------- Vistas: Bitácora de Reuniones ---------- */
function vBitacora(){
  const meetsMap = new Map(S.meetings.map(m => [m._id, m]));
  const actsMap = new Map();

  // 1. Agrupar todas las entradas del RSE por actividad
  S.entries.forEach(e => {
    if (!e.actId) return;
    const m = meetsMap.get(e.meetingId);
    const mDate = m ? m.fecha : '0000-00-00';
    if (!actsMap.has(e.actId)) {
      actsMap.set(e.actId, []);
    }
    actsMap.get(e.actId).push({ entry: e, meeting: m, date: mDate });
  });

  const actItems = [];
  actsMap.forEach((entriesList, actId) => {
    // Ordenar de más reciente a más antigua
    entriesList.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.entry.ord||0) - (a.entry.ord||0));
    const latest = entriesList[0];
    const a = actById(actId);
    const isDone = latest.entry.estatus === 'Completado';

    // Trazabilidad cronológica de más antigua a más reciente
    const history = [...entriesList].reverse().map(item => {
      const mNum = item.meeting && item.meeting.num ? `Minuta ${item.meeting.num}` : (item.date ? fShort(item.date) : 'Reunión');
      return {
        mLabel: mNum,
        estatus: item.entry.estatus,
        fecha: item.date,
        nota: item.entry.nota
      };
    });

    actItems.push({
      type: 'act',
      actId: actId,
      entryId: latest.entry._id,
      meetingId: latest.meeting ? latest.meeting._id : '',
      meetingDate: latest.date,
      meetingNum: latest.meeting ? latest.meeting.num : '',
      sistema: a ? a.sistema : '',
      title: a ? a.title : ('Actividad ' + actId),
      detail: latest.entry.nota || (a ? a.riesgo : ''),
      resp: a ? a.responsable : (latest.meeting ? latest.meeting.responsable : ''),
      estatus: latest.entry.estatus,
      avance: a ? prog(a) : (latest.entry.avance || 0),
      deadline: latest.entry.fecha || (latest.meeting ? latest.meeting.proxima : ''),
      done: isDone,
      history: history
    });
  });

  // 2. Acuerdos generales no vinculados a actividades físicas
  const agrItems = [];
  S.agreements.forEach(ag => {
    let matchedId = '';
    const match = /(ACT-\d+)/i.exec(ag.texto + ' ' + (ag.cond||''));
    if (match) matchedId = match[1].toUpperCase();

    // Si ya existe como actividad en el RSE, no duplicarla
    if (matchedId && actsMap.has(matchedId)) return;

    const m = meetsMap.get(ag.meetingId);
    agrItems.push({
      type: 'agr',
      actId: matchedId || '',
      agrId: ag._id,
      meetingId: m ? m._id : '',
      meetingDate: m ? m.fecha : '',
      meetingNum: m ? m.num : '',
      sistema: 'General',
      title: ag.texto,
      detail: ag.cond,
      resp: ag.resp,
      estatus: ag.done ? 'Completado' : (ag.kind === 'entregable' ? 'Próxima entrega' : 'En proceso'),
      avance: ag.done ? 100 : (ag.kind === 'entregable' ? 50 : 25),
      deadline: ag.fecha,
      done: !!ag.done,
      history: []
    });
  });

  const allItems = [...actItems, ...agrItems];

  // Aplicar filtros
  const bq = (F.bq||'').toLowerCase().trim();
  const filtered = allItems.filter(x => {
    if (bq && !(x.actId + ' ' + x.title + ' ' + (x.detail||'') + ' ' + (x.resp||'')).toLowerCase().includes(bq)) return false;
    if (F.bm && x.meetingId !== F.bm) return false;
    if (F.be && x.estatus !== F.be) return false;
    if (F.bs && x.sistema !== F.bs) return false;
    return true;
  });

  // Dividir entre pendientes y completadas
  const activeItems = filtered.filter(x => !x.done);
  const doneItems = filtered.filter(x => x.done);

  // Ordenar actividades activas:
  // 1. Próxima entrega, 2. En proceso, 3. Bloqueado, 4. Pendiente (y dentro de eso fecha de reunión más reciente)
  activeItems.sort((a,b) => {
    const sDiff = statusRank(a.estatus) - statusRank(b.estatus);
    if (sDiff !== 0) return sDiff;
    const dDiff = (b.meetingDate||'').localeCompare(a.meetingDate||'');
    if (dDiff !== 0) return dDiff;
    return actNum(a.actId) - actNum(b.actId);
  });

  // Ordenar completadas por fecha más reciente de reunión
  doneItems.sort((a,b) => (b.meetingDate||'').localeCompare(a.meetingDate||'') || actNum(a.actId) - actNum(b.actId));

  const totalOpen = allItems.filter(x => !x.done).length;
  const sistemasList = [...new Set(allItems.map(x => x.sistema).filter(Boolean))].sort();
  const meetingsList = sortedMeets();
  const opt = (arr, v) => arr.map(x => `<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('');

  const renderTableRows = (items, isDoneSection) => items.map(x => `
    <tr class="${isDoneSection ? 'muted' : ''}" style="${isDoneSection ? 'background:rgba(22,163,74,0.02)' : ''}">
      <td class="mono" style="white-space:nowrap">${x.meetingDate ? (x.meetingNum ? 'Minuta '+x.meetingNum+' · ' : '') + fShort(x.meetingDate) : '—'}</td>
      <td>${x.actId ? `<button class="btn sm" data-a="openAct" data-id="${x.actId}" style="font-weight:700;color:var(--accent);font-family:var(--f-mono)">${esc(x.actId)}</button>` : '<span class="mono muted">GRAL</span>'}</td>
      <td style="min-width:210px;${isDoneSection?'text-decoration:line-through;color:var(--muted)':''}">
        <b>${esc(x.title)}</b>
        ${x.sistema ? `<div class="note" style="font-size:11.5px">${esc(x.sistema)}</div>` : ''}
      </td>
      <td style="min-width:250px;font-size:13.5px">${esc(x.detail)}</td>
      <td>${esc(x.resp||'—')}</td>
      <td>${pill(x.estatus)}</td>
      <td><div class="prog"><div class="t"><i style="width:${x.avance||0}%"></i></div><span>${x.avance||0}%</span></div></td>
      <td>
        ${x.history && x.history.length > 1 ? `
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
            ${x.history.map((h, i) => `
              <span class="pill ${KEY[h.estatus] ? 's-'+KEY[h.estatus] : 's-idle'}" style="font-size:11px;padding:2px 7px" title="${h.fecha ? fShort(h.fecha)+': ' : ''}${esc(h.nota||h.estatus)}">
                ${h.mLabel}: ${h.estatus}
              </span>
              ${i < x.history.length - 1 ? '<span style="color:var(--muted);font-size:11px">➔</span>' : ''}
            `).join('')}
          </div>
        ` : (x.history && x.history.length === 1 ? `<span class="note">${x.history[0].mLabel}: ${x.history[0].estatus}</span>` : '<span class="muted">—</span>')}
      </td>
      <td style="text-align:center">
        <input type="checkbox" data-a="${x.type === 'act' ? 'togRse' : 'togAgr'}" data-id="${x.type === 'act' ? x.entryId : x.agrId}" ${x.done ? 'checked' : ''} aria-label="Cumplido" title="Marcar como cumplido / completado">
      </td>
    </tr>
  `).join('');

  return `
  <div class="pagehead">
    <div>
      <h2>Bitácora de Reuniones <span class="muted" style="font-size:18px">${totalOpen} pendientes de ${allItems.length}</span></h2>
      <p class="note" style="margin:2px 0 0">Vista unificada de acuerdos y entregables de cada minuta con trazabilidad histórica completa.</p>
    </div>
    <div class="row">
      <button class="btn" data-a="xlsx">Exportar a Excel</button>
    </div>
  </div>

  <!-- Herramientas de Filtro de Bitácora -->
  <div class="filters" style="margin-bottom:14px">
    <input id="f_bq" data-f="bq" placeholder="🔍 Buscar por ID, actividad o notas..." value="${esc(F.bq||'')}" style="flex:1;min-width:200px">
    <select id="f_bm" data-f="bm">
      <option value="">Todas las minutas</option>
      ${meetingsList.map(m => `<option value="${m._id}" ${F.bm===m._id?'selected':''}>Minuta ${m.num||''} (${fShort(m.fecha)})</option>`).join('')}
    </select>
    <select id="f_be" data-f="be">
      <option value="">Todos los estatus</option>
      ${opt(ACT_EST, F.be)}
    </select>
    <select id="f_bs" data-f="bs">
      <option value="">Todos los sistemas</option>
      ${opt(sistemasList, F.bs)}
    </select>
    ${(F.bq||F.bm||F.be||F.bs) ? `<button class="btn sm" data-a="clearBFilters">Limpiar filtros</button>` : ''}
  </div>

  <!-- Sección 1: Actividades en Seguimiento (Pendientes / En proceso / Próxima entrega) -->
  <div class="panel" style="margin-bottom:20px;border-top:3px solid var(--accent)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0;font-size:16px;color:var(--ink);text-transform:none;letter-spacing:0">
        Actividades en Seguimiento (${activeItems.length})
      </h3>
      <span class="note" style="font-size:12px">Prioridad: Próxima entrega ➔ En proceso ➔ Bloqueado ➔ Pendiente</span>
    </div>
    <div class="tw"><table><thead><tr>
      <th>Última Minuta</th>
      <th style="min-width:85px">ID</th>
      <th>Actividad</th>
      <th>Qué se entrega (Notas PROFALCA)</th>
      <th>Responsable</th>
      <th>Estatus actual</th>
      <th>Avance</th>
      <th style="min-width:180px">Trazabilidad por Minuta</th>
      <th style="text-align:center">Cumplido</th>
    </tr></thead><tbody>
      ${activeItems.length ? renderTableRows(activeItems, false) : '<tr><td colspan="9" class="empty">No hay actividades en seguimiento con los filtros actuales.</td></tr>'}
    </tbody></table></div>
  </div>

  <!-- Sección 2: Actividades Completadas (Separadas visualmente al final) -->
  <div class="panel" style="border-top:3px solid var(--ok);background:rgba(22,163,74,0.02)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0;font-size:16px;color:var(--ok);text-transform:none;letter-spacing:0">
        ✓ Actividades Completadas
      </h3>
      <span class="pill s-ok" style="font-size:11px">${doneItems.length} finalizadas</span>
    </div>
    <div class="tw"><table><thead><tr>
      <th>Minuta Cierre</th>
      <th style="min-width:85px">ID</th>
      <th>Actividad</th>
      <th>Entregable final / Observación</th>
      <th>Responsable</th>
      <th>Estatus</th>
      <th>Avance</th>
      <th style="min-width:180px">Trazabilidad Histórica</th>
      <th style="text-align:center">Reabrir</th>
    </tr></thead><tbody>
      ${doneItems.length ? renderTableRows(doneItems, true) : '<tr><td colspan="9" class="empty">Aún no hay actividades completadas en esta sección.</td></tr>'}
    </tbody></table></div>
  </div>
  `;
}

/* ---------- Modales y Formularios ---------- */
function openModal(title, body, onSave, opts){
  const el = $('#modal');
  el.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3>${body}<div class="err" id="m_err" hidden></div>
   <div class="acts">${opts&&opts.del?'<button class="btn danger sp" id="m_del">Eliminar</button>':''}<button class="btn" id="m_cancel">Cancelar</button><button class="btn pri" id="m_save">Guardar</button></div></div>`;
  el.classList.add('on');
  const close = () => { el.classList.remove('on'); el.innerHTML = ''; };
  const showErr = e => { const x=$('#m_err'); x.hidden=false; x.textContent=e&&e.message?e.message:'Error al guardar.'; };
  $('#m_cancel').onclick = close;
  $('#m_save').onclick = async () => { try{ await onSave(); close(); }catch(e){ showErr(e); } };
  if(opts && opts.del){
    const b = $('#m_del'); let armed = false;
    b.onclick = async () => {
      if(!armed){ armed = true; b.textContent = 'Confirmar eliminación'; return; }
      try{ await opts.del(); close(); }catch(e){ showErr(e); }
    };
  }
  el.onclick = e => { if(e.target === el) close(); };
  const f = el.querySelector('input:not([disabled]),textarea,select');
  if(f && !/Android|iPhone/.test(navigator.userAgent)) f.focus();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modal').classList.contains('on')){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; } });

function meetModal(id){
  const m = id ? S.meetings.find(x => x._id === id) : null;
  const ms = sortedMeets(), last = ms[0];
  const nf0 = last ? addDays(last.fecha,7) : today();
  const v = m || { num:String(Math.max(0,...S.meetings.map(x=>parseInt(x.num)||0))+1), fecha:nf0, proxima:addDays(nf0,7), participantes:last?last.participantes:[], objetivo:last?last.objetivo:'Seguimiento proyecto de arranque de PROFALCA.', ruta:last?last.ruta:'', responsable:last?last.responsable:'', semana:weekLabel(nf0), entrega:nf0 };
  
  openModal(m ? 'Editar datos de la reunión' : 'Nueva reunión', `<div class="form">
   <div class="f t"><label>Minuta N.º</label><input id="f_num" value="${esc(v.num)}"></div>
   <div class="f t"><label>Fecha de la reunión</label><input id="f_fecha" type="date" value="${esc(v.fecha)}"></div>
   <div class="f t"><label>Próxima reunión</label><input id="f_prox" type="date" value="${esc(v.proxima)}"></div>
   <div class="f"><label>Participantes (uno por línea o separados por coma)</label><textarea id="f_part" style="min-height:80px">${esc((v.participantes||[]).join('\n'))}</textarea></div>
   <div class="f"><label>Objetivo</label><input id="f_obj" value="${esc(v.objetivo)}"></div>
   <div class="f"><label>Nota importante (aparece al inicio de la minuta)</label><textarea id="f_nota" style="min-height:60px">${esc(v.nota)}</textarea></div>
   <div class="f h"><label>RSE · Semana</label><input id="f_sem" value="${esc(v.semana)}"></div>
   <div class="f h"><label>RSE · Ruta evaluada</label><input id="f_ruta" value="${esc(v.ruta)}"></div>
   <div class="f h"><label>RSE · Responsable del reporte</label><input id="f_resp" value="${esc(v.responsable)}"></div>
   <div class="f h"><label>RSE · Fecha de entrega</label><input id="f_ent" type="date" value="${esc(v.entrega)}"></div></div>`, async () => {
    const g = k => $('#f_'+k).value.trim();
    if(!g('fecha')) throw new Error('Indica la fecha de la reunión.');
    const d = { num:g('num'), fecha:g('fecha'), proxima:g('prox'), participantes:g('part').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean), objetivo:g('obj'), nota:g('nota'), semana:g('sem')||weekLabel(g('fecha')), ruta:g('ruta'), responsable:g('resp'), entrega:g('ent')||g('fecha') };
    if(m){
      await wupd('meetings', m._id, d, `Editó datos de la reunión ${fShort(d.fecha)}`);
    } else {
      const nid = 'm-' + d.fecha;
      if(S.meetings.some(x => x._id === nid)) throw new Error('Ya existe una reunión con esa misma fecha.');
      d.secs = [];
      await wset('meetings', nid, d, `Creó la reunión ${fShort(d.fecha)}`);
      selM = nid; sub = 'resumen';
    }
    toast('Reunión guardada exitosamente');
  }, m ? { del: async () => {
    for(const e of S.entries.filter(x => x.meetingId === m._id)) await wdel('entries', e._id);
    for(const e of S.agreements.filter(x => x.meetingId === m._id)) await wdel('agreements', e._id);
    await wdel('meetings', m._id, `Eliminó la reunión ${fShort(m.fecha)}`);
    selM = null; toast('Reunión eliminada');
  } } : null);
}

function secModal(i){
  const m = curMeet(), s = [...(m.secs||[])], x = i==null ? {t:'',b:''} : s[i];
  openModal(i==null ? 'Nuevo tema tratado' : 'Editar tema', `<div class="form"><div class="f"><label>Título del tema</label><input id="f_t" value="${esc(x.t)}"></div>
   <div class="f"><label>Texto (para viñetas empieza la línea con “- ”)</label><textarea id="f_b" style="min-height:220px">${esc(x.b)}</textarea></div></div>`, async () => {
    const t = $('#f_t').value.trim(); if(!t) throw new Error('Escribe un título.');
    const n = { t, b:$('#f_b').value.trim() };
    if(i == null) s.push(n); else s[i] = n;
    await wupd('meetings', m._id, { secs: s }, `Editó temas de la reunión ${fShort(m.fecha)}`);
    toast('Tema guardado');
  }, i == null ? null : { del: async () => { s.splice(i,1); await wupd('meetings', m._id, { secs: s }, `Eliminó un tema de la reunión ${fShort(m.fecha)}`); } });
}

async function moveSec(i,d){
  const m = curMeet(), s = [...(m.secs||[])], j = i + d;
  if(j < 0 || j >= s.length) return;
  [s[i], s[j]] = [s[j], s[i]];
  try{ await wupd('meetings', m._id, { secs: s }); }catch(e){ fail(e); }
}

function entModal(id){
  const m = curMeet(), e = id ? S.entries.find(x => x._id === id) : null;
  const used = new Set(S.entries.filter(x => x.meetingId === m._id).map(x => x.actId));
  const av = sortedActs().filter(a => !used.has(a._id) || (e && e.actId === a._id));
  const act = e ? actById(e.actId) : null;
  const currAvance = act ? prog(act) : (e && e.avance != null ? e.avance : '');
  const v = e || { estatus: 'Próxima entrega', nota: '', fecha: '', avance: '' };
  
  openModal(e ? 'Editar actividad en el Plan de Trabajo (RSE)' : 'Agregar actividad al Plan de Trabajo (RSE)', `<div class="form">
   <div class="f"><label>Actividad</label><select id="f_act" ${e?'disabled':''}>${av.map(a => `<option value="${a._id}" ${e&&e.actId===a._id?'selected':''}>${a._id} · ${esc(a.title)}</option>`).join('')}</select></div>
   <div class="f t"><label>Estatus en el RSE</label><select id="f_est">${ENT_EST.map(x => `<option ${v.estatus===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="f t"><label>Avance %</label><input id="f_av" type="number" min="0" max="100" placeholder="0 - 100" value="${currAvance}"></div>
   <div class="f t"><label>Fecha límite / acción</label><input id="f_fecha" type="date" value="${esc(v.fecha)}"></div>
   <div class="f"><label>Compromiso / Qué se entrega (Notas estatus PROFALCA)</label><textarea id="f_nota" style="min-height:100px" placeholder="Describe qué entregable o trabajo se compromete para la próxima reunión...">${esc(v.nota)}</textarea></div>
   <div class="f" style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px;padding:8px 12px;display:flex;align-items:center;gap:8px">
     <span style="font-size:16px">⚡</span>
     <span style="font-size:12.5px;color:var(--ink)"><b>Sincronización automática:</b> Al guardar, el estatus y el avance se actualizarán en la lista de Actividades y en el Tablero sin pasos adicionales.</span>
   </div>
  </div>`, async () => {
    const actId = e ? e.actId : $('#f_act').value;
    if(!actId) throw new Error('No quedan actividades disponibles por agregar.');
    const newEst = $('#f_est').value;
    const rawAv = $('#f_av') ? $('#f_av').value.trim() : '';
    const newAv = rawAv !== '' ? Math.min(100, Math.max(0, parseFloat(rawAv) || 0)) : null;
    const d = { meetingId: m._id, actId, estatus:newEst, fecha:$('#f_fecha').value, nota:$('#f_nota').value.trim() };
    if (newAv !== null) d.avance = newAv;
    if(e){
      await wupd('entries', e._id, d, `Editó ${actId} en plan de trabajo ${fShort(m.fecha)}`);
    } else {
      d.ord = Math.max(0, ...S.entries.filter(x => x.meetingId === m._id).map(x => x.ord || 0)) + 1;
      await wset('entries', rid('e-'), d, `Agregó ${actId} a plan de trabajo ${fShort(m.fecha)}`);
    }

    // ACTUALIZACIÓN AUTOMÁTICA EN LA ACTIVIDAD MAESTRA (Mismo estatus exacto y avance)
    const actUpdate = { estatus: newEst };
    if (newEst === 'Completado') {
      actUpdate.avance = 100;
    } else if (newAv !== null) {
      actUpdate.avance = newAv;
    }
    if (d.nota) actUpdate.bloqueo = newEst === 'Bloqueado' ? d.nota : (actById(actId)?.bloqueo || '');
    await wupd('acts', actId, actUpdate, `Sincronizó estatus y avance de ${actId}`);

    toast('Actividad guardada y sincronizada automáticamente');
  }, e ? { del: async () => { await wdel('entries', e._id, `Quitó ${e.actId} del plan de trabajo ${fShort(m.fecha)}`); } } : null);
}

async function carry(){
  const m = curMeet(), prev = sortedMeets().find(x => x.fecha < m.fecha);
  if(!prev){ toast('No se encontró una reunión anterior.'); return; }
  const have = new Set(S.entries.filter(x => x.meetingId === m._id).map(x => x.actId));
  const src = sortedEntries(prev._id).filter(e => e.estatus !== 'Completado' && !have.has(e.actId));
  if(!src.length){ toast('No hay actividades pendientes por traer.'); return; }
  let o = Math.max(0, ...S.entries.filter(x => x.meetingId === m._id).map(x => x.ord || 0));
  try {
    for(const e of src){
      await wset('entries', rid('e-'), { meetingId: m._id, actId: e.actId, estatus: e.estatus, fecha: '', nota: e.nota, ord: ++o });
    }
    logc(`Trajo ${src.length} pendientes a la bitácora ${fShort(m.fecha)}`);
    toast(`${src.length} actividades traídas. Puedes actualizar sus notas.`);
  } catch(x){ fail(x); }
}

   <div class="f"><label>Condición / Descripción del entregable</label><textarea id="f_cd" style="min-height:65px">${esc(v.cond)}</textarea></div>

    const d = { meetingId: m._id, kind: $('#f_kd').value, texto:$('#f_tx').value.trim(), cond:$('#f_cd').value.trim(), resp:$('#f_rs').value.trim(), fecha:$('#f_fc').value, done:$('#f_dn').checked };
    if(!d.texto) throw new Error('Escribe el acuerdo.');
    if(x){
      await wupd('agreements', x._id, d, `Editó un acuerdo (${fShort(m.fecha)})`);
    } else {
      d.ord = Math.max(0, ...S.agreements.filter(a => a.meetingId === m._id && a.kind === k).map(a => a.ord || 0)) + 1;
      await wset('agreements', rid('a-'), d, `Agregó un acuerdo (${fShort(m.fecha)})`);
    }
    toast('Acuerdo guardado');
  }, x ? { del: async () => { await wdel('agreements', x._id, `Eliminó un acuerdo (${fShort(m.fecha)})`); } } : null);
}

/* ---------- Generadores de PDF y Excel ---------- */
function pdfName(m){ const [y,mo,d]=m.fecha.split('-'); return `MINUTA_${m.num||'X'}_REUNION_${d}_${MESES[+mo-1]}_${y}.pdf`; }

function makePDF(m){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('El generador de PDF no cargó.'); return null; }
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight();
  const M = 48, MW = PW - 2*M;
  let y = M;

  const need = hh => {
    if(y + hh > PH - 48){
      doc.addPage();
      y = M;
    }
  };

  // 1. BANNER CORPORATIVO SUPERIOR
  doc.setFillColor(7, 56, 78); // #07384E
  doc.rect(M, y, MW, 38, 'F');
  
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text('PROFALCA', M + 14, y + 16);
  
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(168, 209, 226); // #A8D1E2
  doc.text('PROYECTO DE PRE-ARRANQUE — CONTROL OPERACIONAL', M + 14, y + 29);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.setTextColor(255, 255, 255);
  doc.text(`MINUTA ${m.num || '—'}`, PW - M - 14, y + 24, { align: 'right' });
  y += 48;

  // 2. TABLA METADATOS DE LA REUNIÓN
  const metaBody = [
    [
      { content: `Fecha de Reunión: ${fLong(m.fecha)}`, styles: { fontStyle: 'bold' } },
      { content: `Próxima Reunión: ${m.proxima ? fLong(m.proxima) : 'Por definir'}`, styles: { fontStyle: 'bold' } },
      { content: `Responsable del reporte: ${m.responsable || 'Gelsy Sonnessa'}`, styles: { fontStyle: 'bold' } }
    ],
    [
      { content: `Participantes: ${(m.participantes || []).join(', ') || 'No registrados'}`, colSpan: 3 }
    ],
    [
      { content: `Objetivo: ${m.objetivo || 'Seguimiento del proyecto de arranque.'}`, colSpan: 3 }
    ]
  ];

  doc.autoTable({
    startY: y,
    body: metaBody,
    margin: { left: M, right: M },
    theme: 'plain',
    styles: {
      fontSize: 8.5,
      cellPadding: 4.5,
      textColor: [30, 41, 59],
      lineColor: [210, 220, 226],
      lineWidth: 0.75,
      fillColor: [248, 250, 252]
    }
  });
  y = doc.lastAutoTable.finalY + 12;

  // 3. NOTA IMPORTANTE (Si existe)
  if (m.nota) {
    need(40);
    const notaLines = doc.splitTextToSize(m.nota, MW - 24);
    const notaH = notaLines.length * 11 + 20;
    need(notaH);
    doc.setFillColor(254, 243, 199);
    doc.rect(M, y, MW, notaH, 'F');
    doc.setFillColor(217, 119, 6);
    doc.rect(M, y, 4, notaH, 'F');
    
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(180, 83, 9);
    doc.text('NOTA IMPORTANTE:', M + 12, y + 12);
    
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.setTextColor(60, 50, 30);
    doc.text(notaLines, M + 12, y + 23, { align: 'justify', maxWidth: MW - 24 });
    y += notaH + 14;
  }

  // 4. SECCIÓN 1: RESUMEN DE LO TRATADO (Texto Justificado)
  const s = m.secs || [];
  if (s.length) {
    need(45);
    doc.setFillColor(235, 243, 248);
    doc.rect(M, y, MW, 22, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10.5);
    doc.setTextColor(7, 56, 78);
    doc.text('1. RESUMEN DE LO TRATADO', M + 8, y + 15);
    y += 34; // Espacio limpio de 12pt tras el rectángulo de 22pt para evitar montura

    s.forEach((sec, idx) => {
      // Evitar títulos huérfanos al final de página (exige espacio para título + al menos 2 líneas de texto)
      need(65);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.setTextColor(11, 86, 120);
      doc.text(`1.${idx + 1}. ${sec.t}`, M, y);
      y += 14;

      const pList = String(sec.b || '').split('\n');
      pList.forEach(rawP => {
        const bulletMatch = /^\s*[-•●]\s+(.*)$/.exec(rawP);
        if (bulletMatch) {
          const bText = bulletMatch[1];
          const lines = doc.splitTextToSize(bText, MW - 16);
          need(lines.length * 11 + 4);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          doc.setTextColor(11, 86, 120);
          doc.text('•', M + 6, y + 8);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(30, 41, 59);
          doc.text(lines, M + 16, y + 8, { maxWidth: MW - 16, align: 'justify' });
          y += lines.length * 11 + 4;
        } else if (rawP.trim()) {
          const lines = doc.splitTextToSize(rawP.trim(), MW);
          need(lines.length * 11 + 6);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(30, 41, 59);
          doc.text(lines, M, y + 8, { maxWidth: MW, align: 'justify' });
          y += lines.length * 11 + 6;
        }
      });
      y += 8;
    });
  }

  // 5. SECCIÓN 2: PLAN DE TRABAJO Y COMPROMISOS / ACUERDOS
  const ags = S.agreements.filter(x => x.meetingId === m._id).sort((a,b)=>(a.ord||0)-(b.ord||0));
  let secNum = 2;
  if (ags.length) {
    need(55);
    doc.setFillColor(235, 243, 248);
    doc.rect(M, y, MW, 22, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10.5);
    doc.setTextColor(7, 56, 78);
    doc.text(`${secNum++}. COMPROMISOS Y ACCIONES PARA LA PRÓXIMA REUNIÓN${m.proxima ? ' (' + fShort(m.proxima) + ')' : ''}`, M + 8, y + 15);
    y += 32;

    doc.autoTable({
      startY: y,
      head: [['N.º', 'Tipo', 'Compromiso / Acción', 'Condición / Observación', 'Responsable']],
      body: ags.map((x, i) => [
        i + 1,
        x.kind === 'entregable' ? 'Entregable' : 'Acción',
        x.texto,
        x.cond || '—',
        x.resp || '—'
      ]),
      margin: { left: M, right: M },
      theme: 'grid',
      styles: { fontSize: 8.5, cellPadding: 4, textColor: [30, 41, 59], lineColor: [205, 215, 222] },
      headStyles: { fillColor: [11, 86, 120], textColor: [255, 255, 255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [250, 252, 254] },
      columnStyles: {
        0: { cellWidth: 26, halign: 'center' },
        1: { cellWidth: 65 },
        4: { cellWidth: 80 }
      }
    });
    y = doc.lastAutoTable.finalY + 14;
  }

  // 6. SECCIÓN 3: PLAN DE TRABAJO SEMANAL (RSE) - PÁGINA HORIZONTAL
  const ents = sortedEntries(m._id);
  if (ents.length) {
    doc.addPage('a4', 'landscape');
    const W2 = doc.internal.pageSize.getWidth(), H2 = doc.internal.pageSize.getHeight();
    const M2 = 36, MW2 = W2 - 2 * M2;
    let y2 = M2;

    doc.setFillColor(7, 56, 78);
    doc.rect(M2, y2, MW2, 34, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    doc.text('REPORTE SEMANAL DE ESTADO (RSE) | PRE-ARRANQUE PROFALCA', M2 + 12, y2 + 15);
    doc.setFontSize(8.5);
    doc.setTextColor(168, 209, 226);
    doc.text('Matriz de avance de actividades / plan de trabajo', M2 + 12, y2 + 27);
    y2 += 40;

    doc.autoTable({
      startY: y2,
      body: [
        [
          `Semana: ${m.semana || weekLabel(m.fecha)}`,
          `Ruta evaluada: ${m.ruta || 'Línea de producción pre-arranque'}`,
          `Responsable del reporte: ${m.responsable || 'Gelsy Sonnessa'}`,
          `Fecha de entrega: ${fShort(m.entrega || m.fecha)}`
        ]
      ],
      margin: { left: M2, right: M2 },
      theme: 'plain',
      styles: { fontSize: 8.5, cellPadding: 3.5, textColor: [30, 41, 59], fillColor: [245, 248, 250], lineColor: [210, 220, 226], lineWidth: 0.5 }
    });
    y2 = doc.lastAutoTable.finalY + 10;

    const hasF = ents.some(e => e.fecha);
    doc.autoTable({
      startY: y2,
      head: [['ID', 'Actividad', 'Responsable', 'Estatus', ...(hasF ? ['Fecha límite'] : []), 'Compromiso / Notas PROFALCA']],
      body: ents.map(e => {
        const a = actById(e.actId);
        return [
          e.actId,
          a ? a.title : '',
          a ? (a.responsable || '—') : '—',
          e.estatus,
          ...(hasF ? [e.fecha ? fShort(e.fecha) : '—'] : []),
          e.nota || '—'
        ];
      }),
      margin: { left: M2, right: M2 },
      theme: 'grid',
      styles: { fontSize: 8.5, cellPadding: 4, textColor: [30, 41, 59], lineColor: [205, 215, 222] },
      headStyles: { fillColor: [11, 86, 120], textColor: [255, 255, 255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [250, 252, 254] },
      columnStyles: {
        0: { cellWidth: 46, halign: 'center', fontStyle: 'bold' },
        1: { cellWidth: 155 },
        2: { cellWidth: 70 },
        3: { cellWidth: 80, fontStyle: 'bold' },
        ...(hasF ? { 4: { cellWidth: 65, halign: 'center' } } : {})
      }
    });
  }

  // 7. PIE DE PÁGINA EJECUTIVO EN TODAS LAS PÁGINAS
  const totalPages = doc.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    const curW = doc.internal.pageSize.getWidth();
    const curH = doc.internal.pageSize.getHeight();
    const pad = curW > curH ? 36 : 48;

    doc.setDrawColor(215, 225, 230);
    doc.setLineWidth(0.75);
    doc.line(pad, curH - 22, curW - pad, curH - 22);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(100, 115, 125);
    doc.text(`PROFALCA · Seguimiento de Pre-Arranque | Minuta ${m.num || 'X'} (${fShort(m.fecha)})`, pad, curH - 11);
    doc.text(`Página ${i} de ${totalPages}`, curW - pad, curH - 11, { align: 'right' });
  }

  return doc;
}

async function doPDF(){
  const m = curMeet(); if(!m) return;
  const d = makePDF(m);
  if(d) saveFile(pdfName(m), d.output('blob'));
}

async function doCopy(){
  const m = curMeet(); if(!m) return;
  const html = `<div style="font-family:Arial,sans-serif;font-size:14px">${minutaHTML(m)}</div>`;
  const tmp = document.createElement('div'); tmp.innerHTML = html; const plain = tmp.innerText || tmp.textContent;
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([plain],{type:'text/plain'}) })]);
    toast('Minuta copiada. Puedes pegarla en Word o en tu correo.');
    return;
  } catch(e){}
  try {
    sub = 'previa'; render();
    const r = document.createRange(); r.selectNodeContents($('#paper'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('Texto seleccionado. Presiona Ctrl+C para copiarlo.');
  } catch(e){ toast('No se pudo copiar.'); }
}

async function doXlsx(){
  if(!window.XLSX){ toast('El generador de Excel no cargó.'); return; }
  const wb = XLSX.utils.book_new();
  const acts = [
    ['ID','#','Actividad','Sistema','Riesgo que reduce','Batch','Estatus','Avance %','Responsable','Costo','Moneda','Anticipo','Pagado','Fecha objetivo','Depende de','Bloqueo','Ruta crítica','Notas'],
    ...sortedActs().map(a => [a._id, a.prio, a.title, a.sistema, a.riesgo, a.batch, a.estatus, prog(a), a.responsable, a.costo, a.moneda, a.anticipo, a.pagado, a.fechaObj, a.depende, a.bloqueo, a.critica?'Sí':'', a.notas])
  ];
  const bit = [
    ['Fecha','Minuta','ID','Actividad','Estatus','Fecha acción','Notas Profalca'],
    ...[...S.entries].map(e => ({e, m: S.meetings.find(x => x._id === e.meetingId)})).filter(x => x.m).sort((a,b) => b.m.fecha.localeCompare(a.m.fecha) || (a.e.ord||0)-(b.e.ord||0)).map(({e,m}) => [m.fecha, m.num, e.actId, (actById(e.actId)||{}).title||'', e.estatus, e.fecha, e.nota])
  ];
  const agr = [
    ['Reunión','Tipo','Acuerdo','Condición / descripción','Responsable','Fecha límite','Cumplido'],
    ...S.agreements.map(x => ({x, m: S.meetings.find(y => y._id === x.meetingId)})).map(({x,m}) => [m?m.fecha:'', x.kind==='acuerdo'?'Acción':'Entregable', x.texto, x.cond, x.resp, x.fecha, x.done?'Sí':'No'])
  ];
  const mt = [
    ['Minuta','Fecha','Próxima','Participantes','Objetivo','Semana','Ruta evaluada','Responsable'],
    ...sortedMeets().map(m => [m.num, m.fecha, m.proxima, (m.participantes||[]).join(', '), m.objetivo, m.semana, m.ruta, m.responsable])
  ];

  [['Actividades',acts],['Bitácora',bit],['Acuerdos',agr],['Reuniones',mt]].forEach(([n,a]) => {
    const ws = XLSX.utils.aoa_to_sheet(a);
    ws['!cols'] = a[0].map((_,i) => ({ wch: i===2||i===6?50:18 }));
    XLSX.utils.book_append_sheet(wb, ws, n);
  });

  const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  saveFile(`PROFALCA_Seguimiento_${today()}.xlsx`, out);
}

async function doImportXlsx(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      toast('Procesando archivo Excel e importando a Firebase...');
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      
      // 1. Actividades
      if(wb.Sheets['Actividades']){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Actividades'], { header: 1 });
        for(let i = 1; i < rows.length; i++){
          const r = rows[i];
          if(!r || !r[0]) continue;
          const id = String(r[0]).trim();
          const d = {
            prio: r[1] != null && r[1] !== '' ? Number(r[1]) : null,
            title: String(r[2] || '').trim(),
            sistema: String(r[3] || '').trim(),
            riesgo: String(r[4] || '').trim(),
            batch: String(r[5] || '1').trim(),
            estatus: String(r[6] || 'Pendiente').trim(),
            avance: r[7] != null && r[7] !== '' ? Number(r[7]) : 0,
            responsable: String(r[8] || '').trim(),
            costo: r[9] != null && r[9] !== '' ? Number(r[9]) : null,
            moneda: String(r[10] || 'USD').trim(),
            anticipo: r[11] != null && r[11] !== '' ? Number(r[11]) : null,
            pagado: r[12] != null && r[12] !== '' ? Number(r[12]) : null,
            fechaObj: r[13] ? String(r[13]).trim() : '',
            depende: r[14] ? String(r[14]).trim() : '',
            bloqueo: r[15] ? String(r[15]).trim() : '',
            critica: String(r[16] || '').toLowerCase().includes('s') || r[16] === true,
            notas: r[17] ? String(r[17]).trim() : ''
          };
          await db.doc('acts/' + id).set(clean(d));
        }
      }

      // 2. Reuniones
      if(wb.Sheets['Reuniones']){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Reuniones'], { header: 1 });
        for(let i = 1; i < rows.length; i++){
          const r = rows[i];
          if(!r || !r[1]) continue;
          const fecha = String(r[1]).trim();
          const id = 'm-' + fecha;
          const d = {
            num: String(r[0] || ''),
            fecha,
            proxima: r[2] ? String(r[2]).trim() : '',
            participantes: r[3] ? String(r[3]).split(/[\n,]+/).map(s=>s.trim()).filter(Boolean) : [],
            objetivo: String(r[4] || ''),
            semana: String(r[5] || ''),
            ruta: String(r[6] || ''),
            responsable: String(r[7] || ''),
            secs: []
          };
          await db.doc('meetings/' + id).set(clean(d), { merge: true });
        }
      }

      // 3. Bitácora (entries)
      if(wb.Sheets['Bitácora']){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Bitácora'], { header: 1 });
        for(let i = 1; i < rows.length; i++){
          const r = rows[i];
          if(!r || !r[0] || !r[2]) continue;
          const fecha = String(r[0]).trim();
          const mid = 'm-' + fecha;
          const actId = String(r[2]).trim();
          const eid = 'e-' + mid + '-' + actId;
          const d = {
            meetingId: mid,
            actId,
            estatus: String(r[4] || 'Pendiente').trim(),
            fecha: r[5] ? String(r[5]).trim() : '',
            nota: String(r[6] || '').trim(),
            ord: i
          };
          await db.doc('entries/' + eid).set(clean(d));
        }
      }

      // 4. Acuerdos
      if(wb.Sheets['Acuerdos']){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Acuerdos'], { header: 1 });
        for(let i = 1; i < rows.length; i++){
          const r = rows[i];
          if(!r || !r[2]) continue;
          const fecha = r[0] ? String(r[0]).trim() : '';
          const mid = fecha ? 'm-' + fecha : (sortedMeets()[0] ? sortedMeets()[0]._id : '');
          const tipo = String(r[1] || '').toLowerCase();
          const kind = tipo.includes('entreg') ? 'entregable' : 'acuerdo';
          const aid = 'a-' + i + '-' + Date.now().toString(36);
          const done = String(r[6] || '').toLowerCase().includes('s') || r[6] === true;
          const d = {
            meetingId: mid,
            kind,
            texto: String(r[2] || '').trim(),
            cond: String(r[3] || '').trim(),
            resp: String(r[4] || '').trim(),
            fecha: r[5] ? String(r[5]).trim() : '',
            done,
            ord: i
          };
          await db.doc('agreements/' + aid).set(clean(d));
        }
      }

      await logc('Importó datos desde archivo Excel');
      toast('¡Todos los datos fueron importados con éxito a Firebase!');
    } catch(err) {
      console.error(err);
      toast('Error al procesar el archivo Excel: ' + (err.message || 'formato inválido'));
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Controladores de Eventos ---------- */
const A = {
  seedData: () => populateInitialData(true),
  syncMeets: () => syncMeetingsText(false),
  nav: d => { view = d.v; try{ localStorage.setItem('pf_view', view); }catch(e){} render(); scrollTo(0,0); },
  goMeet: d => { selM = d.id; view = 'reuniones'; render(); },
  clearMeetQ: () => { F.meetQ = ''; render(); },
  clearBFilters: () => { F.bq = ''; F.bm = ''; F.be = ''; F.bs = ''; render(); },
  clearLog: async () => {
    if(!confirm('¿Estás segura de vaciar el historial de cambios? Tus actividades, minutas y acuerdos permanecerán intactos.')) return;
    try {
      toast('Limpiando historial de cambios...');
      const snap = await db.collection('log').get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      S.log = [];
      render();
      toast('Historial de cambios limpiado con éxito');
    } catch(e) {
      fail(e);
    }
  },
  openAct: d => actModal(d.id), editAct: d => actModal(d.id), newAct: () => actModal(null),
  newMeet: () => meetModal(null), editMeet: () => meetModal(curMeet()._id),
  sub: d => { sub = d.v; render(); },
  addSec: () => secModal(null), editSec: d => secModal(+d.i), secUp: d => moveSec(+d.i,-1), secDn: d => moveSec(+d.i,1),
  addEnt: () => entModal(null), editEnt: d => entModal(d.id), carry,
  addAgr: d => agrModal(null, d.k), editAgr: d => agrModal(d.id),
  togAgr: async (d, el) => {
    try {
      await wupd('agreements', d.id, { done: el.checked }, el.checked ? 'Marcó acuerdo como cumplido' : 'Reabrió un acuerdo');
    } catch(e){ fail(e); }
  },
  togRse: async (d, el) => {
    try {
      const newEst = el.checked ? 'Completado' : 'En proceso';
      const entry = S.entries.find(x => x._id === d.id);
      await wupd('entries', d.id, { estatus: newEst }, el.checked ? 'Marcó actividad RSE como completada' : 'Reabrió actividad RSE');
      if (entry && entry.actId) {
        const actUp = { estatus: newEst };
        if (el.checked) actUp.avance = 100;
        await wupd('acts', entry.actId, actUp, `Sincronizó estatus de ${entry.actId} a ${newEst}`);
      }
      toast(el.checked ? 'Actividad marcada como completada (100%)' : 'Actividad reabierta');
    } catch(e){ fail(e); }
  },
  pdf: doPDF, copy: doCopy, xlsx: doXlsx,
  saveCfg: async () => {
    const v = $('#cfg_f').value;
    try {
      await wset('config', 'main', { fondos: v === '' ? null : Number(v) }, 'Actualizó los fondos del proyecto');
      toast('Presupuesto guardado');
    } catch(e){ fail(e); }
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.matches('input[type=checkbox]')){ e.stopPropagation(); A[b.dataset.a] && A[b.dataset.a](b.dataset, b); return; }
  if(b.tagName === 'A') e.preventDefault();
  const fn = A[b.dataset.a]; if(fn) fn(b.dataset, b);
});

document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f; if(f){ F[f] = e.target.value; render(); } });
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'f_import_xlsx' && e.target.files && e.target.files[0]){
    doImportXlsx(e.target.files[0]);
    e.target.value = '';
    return;
  }
  const f = e.target.dataset && e.target.dataset.f;
  if(f){ F[f] = e.target.value; render(); }
});

boot().catch(e => {
  console.error("Error en boot:", e);
  $('#app').innerHTML = '<div class="empty">Error al inicializar la aplicación.</div>';
});

})();
